# ══════════════════════════════════════════════════════════
# Render Blueprint — UPI Fraud Detection Backend
# ══════════════════════════════════════════════════════════
# Supabase PostgreSQL Database: Set DATABASE_URL manually
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: upi-fraud-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --skip-generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set manually in Environment to your Supabase URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set manually to your Vercel frontend URL
      - key: ML_API_URL
        sync: false # Set manually to your ML API URL
    healthCheckPath: /api/health
    autoDeploy: true
