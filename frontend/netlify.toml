# ══════════════════════════════════════════════════════════
# Netlify Config — UPI Fraud Detection Frontend
# ══════════════════════════════════════════════════════════
# Deploy: Connect this repo, set base directory to "frontend"
# Env vars: Set VITE_API_URL and VITE_ML_API_URL in Netlify dashboard

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# SPA routing — redirect all paths to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
