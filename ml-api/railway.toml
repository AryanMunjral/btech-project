# ══════════════════════════════════════════════════════════
# Railway Config — UPI Fraud Detection ML API
# ══════════════════════════════════════════════════════════
# Deploy: Connect this repo, set root directory to "ml-api"
# Railway auto-detects Python via requirements.txt

[build]
  builder = "nixpacks"

[deploy]
  startCommand = "python train_model.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
  healthcheckPath = "/health"
  healthcheckTimeout = 120
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
