# ══════════════════════════════════════════════════════════
# Render Blueprint — UPI Fraud Detection Backend
# ══════════════════════════════════════════════════════════
# Deploy: Connect this repo to Render, it auto-detects this file.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: upi-fraud-db
    plan: free
    databaseName: upi_fraud_detection
    user: upi_admin

services:
  - type: web
    name: upi-fraud-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run db:seed
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: upi-fraud-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set manually to your Netlify URL
      - key: ML_API_URL
        sync: false # Set manually to your Railway URL
    healthCheckPath: /api/health
    autoDeploy: true
